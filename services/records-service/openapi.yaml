openapi: 3.1.0
info:
  title: RHU LabChain Records and Synchronization API
  version: 0.1.0
  description: >-
    Role-protected patient, consultation, laboratory workflow, immutable result
    version, publication-outbox, audit, and offline synchronization endpoints.
servers:
  - url: /
    description: Direct service or gateway-stripped route
  - url: /v1
    description: Explicitly versioned direct-service route
tags:
  - name: Operations
  - name: Patients
  - name: Clinical
  - name: Laboratory
  - name: Publication
  - name: Synchronization
paths:
  /health:
    get:
      tags: [Operations]
      summary: Liveness probe
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /ready:
    get:
      tags: [Operations]
      summary: Database adapter readiness
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '503': { $ref: '#/components/responses/Error' }
  /dashboard:
    get:
      tags: [Operations]
      summary: Role-scoped workflow counters
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /request-patients:
    get:
      tags: [Clinical]
      summary: Search all active patients for doctor requests
      description: Returns demographics, the current doctor's signed consultation for the latest visit, and any unreviewed visit. Does not expose another doctor's clinical notes.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /patients:
    get:
      tags: [Patients]
      summary: Search role-visible patients
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Patients]
      summary: Register a patient
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientInput' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /patients/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Patients]
      summary: Read an authorized patient
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Patients]
      summary: Update an active patient
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatientInput' } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Patients]
      summary: Soft-deactivate a patient without an active workflow
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /patients/{id}/link:
    post:
      tags: [Patients]
      summary: Link one authentication account to one patient
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AccountLinkInput' } } }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /visits:
    get:
      tags: [Clinical]
      summary: List visits
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Clinical]
      summary: Open a visit
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /consultations:
    get:
      tags: [Clinical]
      summary: List role-visible consultations
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Clinical]
      summary: Create a consultation, optionally with an implicit signed visit
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /consultations/{id}:
    patch:
      tags: [Clinical]
      summary: Update the assigned doctor's draft
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /consultations/{id}/complete:
    post:
      tags: [Clinical]
      summary: Sign a consultation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /catalog:
    get:
      tags: [Laboratory]
      summary: Read the active laboratory catalog
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /orders:
    get:
      tags: [Laboratory]
      summary: List role-visible laboratory orders
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Search'
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Laboratory]
      summary: Create a signed doctor's laboratory order
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /orders/{id}:
    get:
      tags: [Laboratory]
      summary: Read an order and its workflow projection
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /orders/{id}/accession:
    post:
      tags: [Laboratory]
      summary: Accession specimens directly from a requested order; no payment required
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /orders/{id}/collection:
    post:
      tags: [Laboratory]
      summary: Collect the accessioned specimens
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /orders/{id}/receive:
    post:
      tags: [Laboratory]
      summary: Receive collected specimens at the testing bench
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /orders/{id}/rejection:
    post:
      tags: [Laboratory]
      summary: Reject specimens and require recollection
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /orders/{id}/results:
    post:
      tags: [Laboratory]
      summary: Append a draft test result
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResultInput' } } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /orders/{id}/qc:
    post:
      tags: [Laboratory]
      summary: Record quality control without overwriting the result
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [passed], properties: { passed: { type: boolean }, controlLot: { type: [string, 'null'] }, notes: { type: [string, 'null'] } } } } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /orders/{id}/repeat-tests:
    post:
      tags: [Laboratory]
      summary: Start a repeat after failed QC
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /orders/{id}/referrals:
    post:
      tags: [Laboratory]
      summary: Refer a completed or QC-failed attempt externally
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /orders/{id}/submit:
    post:
      tags: [Laboratory]
      summary: Submit a complete QC-passed version for supervisor review
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /orders/{id}/approval:
    post:
      tags: [Publication]
      summary: Approve or reject as a different supervisor actor
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [approve, reject] }, remarks: { type: [string, 'null'] } } } } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '202': { $ref: '#/components/responses/Success' }
  /orders/{id}/release:
    post:
      tags: [Publication]
      summary: Release only after encrypted storage and ledger registration
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '202': { $ref: '#/components/responses/Success' }
  /orders/{id}/doctor-review:
    post:
      tags: [Clinical]
      summary: Append the assigned doctor's review of a released record
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /me/results:
    get:
      tags: [Patients]
      summary: Read only the authenticated patient's released results
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /me/results/{id}:
    get:
      tags: [Patients]
      summary: Read one owned released immutable result version
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /audit:
    get:
      tags: [Operations]
      summary: Read append-only audit events
      parameters:
        - { name: actorUserId, in: query, description: Exact account ID of the actor, schema: { type: string, maxLength: 128 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /sync/outbox:
    get:
      tags: [Synchronization]
      summary: Review publication events and retry state
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /sync/outbox/{id}/retry:
    post:
      tags: [Synchronization]
      summary: Retry an eligible failed publication event
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /sync/events:
    post:
      tags: [Synchronization]
      summary: Apply a bounded offline batch with revision conflict receipts
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SyncBatchInput' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 120 }
    Status:
      name: status
      in: query
      schema: { type: string, maxLength: 80 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  responses:
    Success:
      description: Standard success envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
    Error:
      description: Standard safe error envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
  schemas:
    Envelope:
      type: object
      required: [success, message, data, errors]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { type: object }
        errors: { type: array, items: { type: object } }
    PatientInput:
      type: object
      required: [firstName, lastName]
      properties:
        reasonForVisit: { type: string, minLength: 1, maxLength: 1000, description: Registration only. Creates an open visit for doctor review in the same transaction. }
        patientCode: { type: string, minLength: 3, maxLength: 20 }
        firstName: { type: string, maxLength: 60 }
        middleName: { type: [string, 'null'], maxLength: 60 }
        lastName: { type: string, maxLength: 60 }
        birthDate: { type: [string, 'null'], format: date }
        sex: { type: [string, 'null'], enum: [M, F, Other, null] }
        contactNumber: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        address: { type: [string, 'null'], description: Legacy free-text address; derived from addressDetails when provided. }
        addressDetails: { $ref: '#/components/schemas/PatientAddress' }
    PatientAddress:
      type: [object, 'null']
      required: [street, barangay]
      description: Mlang deployment; municipality defaults to M'lang. Separate address fields. When supplied, replaces the structured address and regenerates the display address. Null clears the address.
      additionalProperties: false
      properties:
        houseNumber: { type: [string, 'null'], maxLength: 60 }
        street: { type: string, minLength: 1, maxLength: 200 }
        barangay: { type: string, minLength: 1, maxLength: 120 }
        municipality: { type: string, const: "M'lang", default: "M'lang" }
        province: { type: [string, 'null'], maxLength: 120 }
        region: { type: [string, 'null'], maxLength: 120 }
        postalCode: { type: [string, 'null'], maxLength: 20 }
        country: { type: [string, 'null'], maxLength: 80 }
    AccountLinkInput:
      type: object
      required: [authUserId]
      properties: { authUserId: { type: string, minLength: 1, maxLength: 128 } }
    ResultInput:
      type: object
      required: [testCode, resultValue]
      properties:
        testCode: { type: string }
        testName: { type: string }
        resultValue: { type: string }
        numericValue: { type: [number, 'null'] }
        unit: { type: [string, 'null'] }
        remarks: { type: [string, 'null'] }
    SyncBatchInput:
      type: object
      required: [deviceId, operations]
      properties:
        deviceId: { type: string, minLength: 3, maxLength: 128 }
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [operationId, entityType, entityId, baseRevision, action, payload]
            properties:
              operationId: { type: string, format: uuid }
              entityType: { type: string, enum: [PATIENT, VISIT, CONSULTATION, RESULT_DRAFT] }
              entityId: { type: string }
              baseRevision: { type: integer, minimum: 0 }
              action: { type: string, enum: [CREATE, UPDATE] }
              payload: { type: object }
