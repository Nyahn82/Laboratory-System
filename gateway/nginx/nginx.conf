limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

upstream web_upstream { server web:80; keepalive 16; }
upstream auth_upstream { server auth-service:3001; keepalive 16; }
upstream records_upstream { server records-service:3002; keepalive 16; }
upstream storage_upstream { server storage-service:3003; keepalive 8; }
upstream verification_upstream { server verification-service:3004; keepalive 16; }

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;
  client_max_body_size 4m;
  client_body_timeout 15s;
  keepalive_timeout 30s;
  include /etc/nginx/snippets/security-headers.conf;

  location = /gateway-health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location = /api/auth/login {
    limit_req zone=login_limit burst=4 nodelay;
    proxy_pass http://auth_upstream/login;
    include /etc/nginx/snippets/proxy-params.conf;
    proxy_set_header X-Request-ID $request_id;
  }

  location /api/auth/ {
    proxy_pass http://auth_upstream/;
    include /etc/nginx/snippets/proxy-params.conf;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 30s;
  }

  location /api/records/ {
    proxy_pass http://records_upstream/;
    include /etc/nginx/snippets/proxy-params.conf;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
  }

  location /api/storage/ {
    proxy_pass http://storage_upstream/;
    include /etc/nginx/snippets/proxy-params.conf;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
  }

  location /api/verification/ {
    proxy_pass http://verification_upstream/;
    include /etc/nginx/snippets/proxy-params.conf;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 30s;
  }

  location / {
    proxy_pass http://web_upstream;
    include /etc/nginx/snippets/proxy-params.conf;
    proxy_set_header X-Request-ID $request_id;
  }
}
